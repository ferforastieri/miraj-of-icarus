name: miraj-of-icarus

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:18.4-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: miraj-of-icarus
      POSTGRES_USER: miraj-of-icarus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in infra/.env}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U miraj-of-icarus -d miraj-of-icarus"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [backend]
    logging: *default-logging

  redis:
    image: redis:8.8.1-alpine3.23
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [backend]
    logging: *default-logging

  api:
    image: miraj-of-icarus-api:${MIRAJ_OF_ICARUS_IMAGE_TAG:?Set MIRAJ_OF_ICARUS_IMAGE_TAG in infra/.env}
    build:
      context: ..
      dockerfile: api/Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Database: Host=postgres;Port=5432;Database=miraj-of-icarus;Username=miraj-of-icarus;Password=${POSTGRES_PASSWORD};GSS Encryption Mode=Disable
      Cache__ConnectionString: redis:6379
      ClientReleases__ChannelManifestUrl: ${MIRAJ_OF_ICARUS_RELEASE_CHANNEL_URL:-https://downloads.mirajoficarus.com/channels/alpha.json}
      DownloadAuthorization__SigningKey: ${DOWNLOAD_AUTHORIZATION_SIGNING_KEY:?Set DOWNLOAD_AUTHORIZATION_SIGNING_KEY in infra/.env}
      Turnstile__SecretKey: ${TURNSTILE_SECRET_KEY:?Set TURNSTILE_SECRET_KEY in infra/.env}
      Database__ApplyMigrations: "true"
      GameServers__0__Id: miraj-of-icarus-alpha
      GameServers__0__Name: Miraj of Icarus Alpha
      GameServers__0__Region: BR
      GameServers__0__LoginEndpoint: ${MIRAJ_OF_ICARUS_PUBLIC_LOGIN_URL:-http://localhost:8081}
      GameServers__0__Available: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${MIRAJ_OF_ICARUS_BIND_ADDRESS:-127.0.0.1}:8080:8080"
    healthcheck:
      test: ["CMD", "/bin/bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health/live HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q '200 OK' <&3"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [backend]
    logging: *default-logging

  main-server:
    image: miraj-of-icarus-main-server:${MIRAJ_OF_ICARUS_IMAGE_TAG:?Set MIRAJ_OF_ICARUS_IMAGE_TAG in infra/.env}
    build:
      context: ..
      dockerfile: game-server/services/coordinator/MirajOfIcarus.MainServer/Dockerfile
    restart: unless-stopped
    environment:
      Cache__ConnectionString: redis:6379
      Internal__ServiceKey: ${GAME_SERVICE_KEY:?Set GAME_SERVICE_KEY in infra/.env}
      Server__Id: miraj-of-icarus-alpha
      Lobby__Endpoint: ${MIRAJ_OF_ICARUS_PUBLIC_LOBBY_URL:?Set MIRAJ_OF_ICARUS_PUBLIC_LOBBY_URL in infra/.env}
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/bin/bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health/ready HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q '200 OK' <&3"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [backend]
    logging: *default-logging

  login-server:
    image: miraj-of-icarus-login-server:${MIRAJ_OF_ICARUS_IMAGE_TAG:?Set MIRAJ_OF_ICARUS_IMAGE_TAG in infra/.env}
    build:
      context: ..
      dockerfile: game-server/services/login/MirajOfIcarus.LoginServer/Dockerfile
    restart: unless-stopped
    environment:
      Cache__ConnectionString: redis:6379
      Main__Endpoint: http://main-server:8080
      Main__ServiceKey: ${GAME_SERVICE_KEY:?Set GAME_SERVICE_KEY in infra/.env}
    depends_on:
      main-server:
        condition: service_healthy
    ports:
      - "${MIRAJ_OF_ICARUS_BIND_ADDRESS:-127.0.0.1}:8081:8080"
    healthcheck:
      test: ["CMD", "/bin/bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health/ready HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q '200 OK' <&3"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [backend]
    logging: *default-logging

  lobby-server:
    image: miraj-of-icarus-lobby-server:${MIRAJ_OF_ICARUS_IMAGE_TAG:?Set MIRAJ_OF_ICARUS_IMAGE_TAG in infra/.env}
    build:
      context: ..
      dockerfile: game-server/services/lobby/MirajOfIcarus.LobbyServer/Dockerfile
    restart: unless-stopped
    environment:
      ConnectionStrings__Database: Host=postgres;Port=5432;Database=miraj-of-icarus;Username=miraj-of-icarus;Password=${POSTGRES_PASSWORD};GSS Encryption Mode=Disable
      Cache__ConnectionString: redis:6379
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${MIRAJ_OF_ICARUS_BIND_ADDRESS:-127.0.0.1}:8083:8080"
    healthcheck:
      test: ["CMD", "/bin/bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health/ready HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q '200 OK' <&3"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [backend]
    logging: *default-logging

  portal:
    image: miraj-of-icarus-portal:${MIRAJ_OF_ICARUS_IMAGE_TAG:?Set MIRAJ_OF_ICARUS_IMAGE_TAG in infra/.env}
    build:
      context: ..
      dockerfile: portal/web/Dockerfile
      args:
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      MIRAJ_OF_ICARUS_API_INTERNAL_URL: http://api:8080
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [backend]
    logging: *default-logging

networks:
  backend:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
