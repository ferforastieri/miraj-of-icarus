name: Portal deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  actions: read
  contents: read

concurrency:
  group: portal-production
  cancel-in-progress: false

jobs:
  changes:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-24.04
    outputs:
      portal: ${{ steps.components.outputs.portal }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: deployment-changes-${{ github.event.workflow_run.head_sha }}
          path: ${{ runner.temp }}/deployment-changes
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
      - name: Read deployment selection
        id: components
        run: grep -Fqx 'portal=true' "$RUNNER_TEMP/deployment-changes/components.env" && echo 'portal=true' >> "$GITHUB_OUTPUT" || echo 'portal=false' >> "$GITHUB_OUTPUT"

  deploy:
    needs: changes
    if: needs.changes.outputs.portal == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/portal/web
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          lfs: true

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/portal/web/package-lock.json

      - run: npm ci
      - name: Build the Cloudflare portal
        env:
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.CLOUDFLARE_TURNSTILE_SITE_KEY }}
        run: npm run build:cloudflare

      - name: Deploy the tested revision to Cloudflare Workers
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx opennextjs-cloudflare deploy

      - name: Verify the public portal
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npx wrangler deployments list --name miraj-of-icarus-portal
          status="$(curl --silent --show-error --output "$RUNNER_TEMP/portal-health.json" --write-out '%{http_code}' \
            --retry 12 --retry-connrefused --retry-delay 5 \
            -H 'Accept: application/json' \
            -H 'User-Agent: MirajOfIcarus-DeploymentCheck/1.0' \
            https://mirajoficarus.com/api/health || true)"
          if [ "$status" = '200' ]; then
            grep -Fq '"status":"healthy"' "$RUNNER_TEMP/portal-health.json"
          elif [ "$status" = '403' ]; then
            echo '::warning::A proteção da Cloudflare bloqueou a sondagem externa; a versão do Worker foi publicada e confirmada pela API de deployments.'
          else
            cat "$RUNNER_TEMP/portal-health.json"
            echo "Portal health check returned HTTP $status" >&2
            exit 1
          fi
