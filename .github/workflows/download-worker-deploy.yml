name: Download worker deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:
    inputs:
      revision:
        description: Full Git SHA already validated by CI
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: download-worker-production
  cancel-in-progress: false

jobs:
  changes:
    if: >-
      github.event_name != 'workflow_dispatch' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-24.04
    outputs:
      download_worker: ${{ steps.components.outputs.download_worker }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: deployment-changes-${{ github.event.workflow_run.head_sha }}
          path: ${{ runner.temp }}/deployment-changes
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
      - name: Read deployment selection
        id: components
        run: grep -Fqx 'download_worker=true' "$RUNNER_TEMP/deployment-changes/components.env" && echo 'download_worker=true' >> "$GITHUB_OUTPUT" || echo 'download_worker=false' >> "$GITHUB_OUTPUT"

  deploy:
    needs: changes
    if: >-
      always() &&
      (github.event_name == 'workflow_dispatch' ||
       needs.changes.outputs.download_worker == 'true')
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend/download-worker
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.revision || github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/download-worker/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - name: Install download authorization secret
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DOWNLOAD_AUTHORIZATION_SIGNING_KEY: ${{ secrets.DOWNLOAD_AUTHORIZATION_SIGNING_KEY }}
        run: printf '%s' "$DOWNLOAD_AUTHORIZATION_SIGNING_KEY" | npx wrangler secret put DOWNLOAD_AUTHORIZATION_SIGNING_KEY
      - name: Deploy to downloads.mirajoficarus.com
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm run deploy
