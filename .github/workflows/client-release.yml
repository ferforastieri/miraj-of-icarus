name: Windows client release

on:
  pull_request:
    paths:
      - game-clients/client-pc/**
      - .github/workflows/client-release.yml
  push:
    branches: [main]
    paths:
      - game-clients/client-pc/**
      - .github/workflows/client-release.yml

permissions:
  contents: read

concurrency:
  group: client-release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-windows:
    name: Build, verify and publish
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install pinned build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ca-certificates cmake curl file gnupg ninja-build openssl python3 zip awscli
          curl --fail --location --silent --show-error https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo gpg --dearmor --batch --yes --output /usr/share/keyrings/llvm-archive-keyring.gpg
          echo 'deb [signed-by=/usr/share/keyrings/llvm-archive-keyring.gpg] https://apt.llvm.org/noble/ llvm-toolchain-noble-20 main' \
            | sudo tee /etc/apt/sources.list.d/llvm20.list >/dev/null
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends clang-20 lld-20 llvm-20 llvm-20-tools

      - name: Cache licensed Windows SDK downloads
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/masicarus-xwin-cache
          key: xwin-0.9.0-sdk-10.0.26100-crt-14.44.17.14

      - name: Prepare Windows SDK
        run: |
          chmod +x game-clients/client-pc/tools/*.sh
          game-clients/client-pc/tools/prepare-xwin.sh \
            "$RUNNER_TEMP/masicarus-xwin" "$RUNNER_TEMP/masicarus-xwin-cache"

      - name: Build launcher and client
        env:
          MASICARUS_RELEASE_VERSION: ${{ github.sha }}
          MASICARUS_PUBLIC_API_URL: https://api.masicarus.com.br
        run: |
          game-clients/client-pc/tools/build-windows.sh \
            "$RUNNER_TEMP/masicarus-xwin" \
            "$RUNNER_TEMP/masicarus-windows-build" \
            "$RUNNER_TEMP/masicarus-release/client" \
            "$RUNNER_TEMP/masicarus-release/launcher"
          file "$RUNNER_TEMP/masicarus-release/launcher/MasicarusLauncher.exe" | grep -F 'PE32+ executable (GUI) x86-64'
          file "$RUNNER_TEMP/masicarus-release/client/MasicarusClient.exe" | grep -F 'PE32+ executable (GUI) x86-64'
          python3 -m json.tool "$RUNNER_TEMP/masicarus-release/client/release-manifest.json" >/dev/null
          game-clients/client-pc/tools/verify-release-manifest.py "$RUNNER_TEMP/masicarus-release/client"

      - name: Sign and verify release
        if: github.event_name == 'push'
        env:
          MASICARUS_RELEASE_SIGNING_KEY_BASE64: ${{ secrets.MASICARUS_RELEASE_SIGNING_KEY_BASE64 }}
        run: |
          game-clients/client-pc/tools/sign-release-manifest.py "$RUNNER_TEMP/masicarus-release/client"
          openssl dgst -sha256 \
            -verify game-clients/client-pc/launcher/keys/release-signing-public.pem \
            -signature "$RUNNER_TEMP/masicarus-release/client/release-manifest.sig" \
            "$RUNNER_TEMP/masicarus-release/client/release-manifest.json"

      - name: Validate signing flow with an ephemeral key
        if: github.event_name == 'pull_request'
        run: |
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out "$RUNNER_TEMP/pr-release-key.pem"
          export MASICARUS_RELEASE_SIGNING_KEY_BASE64="$(base64 -w0 "$RUNNER_TEMP/pr-release-key.pem")"
          game-clients/client-pc/tools/sign-release-manifest.py "$RUNNER_TEMP/masicarus-release/client"
          openssl pkey -in "$RUNNER_TEMP/pr-release-key.pem" -pubout -out "$RUNNER_TEMP/pr-release-public.pem"
          openssl dgst -sha256 \
            -verify "$RUNNER_TEMP/pr-release-public.pem" \
            -signature "$RUNNER_TEMP/masicarus-release/client/release-manifest.sig" \
            "$RUNNER_TEMP/masicarus-release/client/release-manifest.json"

      - name: Package launcher
        working-directory: ${{ runner.temp }}/masicarus-release
        run: cmake -E tar cf MasicarusLauncher.zip --format=zip launcher

      - name: Upload validation artifact
        uses: actions/upload-artifact@v4
        with:
          name: masicarus-windows-${{ github.sha }}
          path: |
            ${{ runner.temp }}/masicarus-release/MasicarusLauncher.zip
            ${{ runner.temp }}/masicarus-release/client/release-manifest.json
          if-no-files-found: error
          retention-days: 14

      - name: Publish immutable release to Cloudflare R2
        if: github.event_name == 'push'
        env:
          CLOUDFLARE_R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_R2_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          MASICARUS_R2_BUCKET: masicarus-releases
          MASICARUS_DOWNLOAD_BASE_URL: https://downloads.masicarus.com.br
        run: game-clients/client-pc/tools/publish-r2-release.sh \
          "${{ github.sha }}" \
          "$RUNNER_TEMP/masicarus-release/client" \
          "$RUNNER_TEMP/masicarus-release/MasicarusLauncher.zip"
