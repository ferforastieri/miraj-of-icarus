name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  dotnet:
    name: .NET
    runs-on: ubuntu-latest
    env:
      ConnectionStrings__Database: Host=127.0.0.1;Port=5432;Database=miraj-of-icarus;Username=miraj-of-icarus;Password=miraj-of-icarus-ci-password;GSS Encryption Mode=Disable
      Cache__ConnectionString: 127.0.0.1:6379
      Database__ApplyMigrations: "true"
    services:
      postgres:
        image: postgres:18.4-bookworm
        env:
          POSTGRES_DB: miraj-of-icarus
          POSTGRES_USER: miraj-of-icarus
          POSTGRES_PASSWORD: miraj-of-icarus-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U miraj-of-icarus -d miraj-of-icarus"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:8.8.1-alpine3.23
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: |
            api/**/packages.lock.json
            game-server/**/packages.lock.json
      - run: dotnet restore api/MirajOfIcarus.slnx --locked-mode
      - run: dotnet restore game-server/MirajOfIcarus.GameServer.slnx --locked-mode
      - run: dotnet test api/MirajOfIcarus.slnx --configuration Release --no-restore
      - run: dotnet test game-server/MirajOfIcarus.GameServer.slnx --configuration Release --no-restore

  client-contracts:
    name: Client contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - run: cmake -S game-clients/client-pc -B build/client -G Ninja -DMIRAJ_OF_ICARUS_BUILD_WINDOWS_APPS=OFF
      - run: cmake --build build/client
      - run: ctest --test-dir build/client --output-on-failure
      - run: game-clients/client-pc/tools/test-publish-r2-release.sh

  portal:
    name: Portal
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: portal/web
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: portal/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm run build:cloudflare
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  download-worker:
    name: Download worker
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: distribution/download-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: distribution/download-worker/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
