name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  deployment-changes:
    name: Deployment changes
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Classify changed production components
        env:
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          backend=false
          portal=false
          download_worker=false

          if git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            changed_files="$(git diff --name-only "$BEFORE_SHA" "$HEAD_SHA")"
          else
            changed_files="$(git diff-tree --root --no-commit-id --name-only -r "$HEAD_SHA")"
          fi

          while IFS= read -r file; do
            case "$file" in
              backend/api/*|backend/game-server/*|backend/infra/*|global.json|.dockerignore|.github/workflows/backend-deploy.yml)
                backend=true
                ;;
            esac

            case "$file" in
              apps/portal/web/*|.github/workflows/portal-deploy.yml)
                portal=true
                ;;
            esac

            case "$file" in
              backend/download-worker/*|.github/workflows/download-worker-deploy.yml)
                download_worker=true
                ;;
            esac
          done <<< "$changed_files"

          mkdir -p "$RUNNER_TEMP/deployment-changes"
          {
            printf 'backend=%s\n' "$backend"
            printf 'portal=%s\n' "$portal"
            printf 'download_worker=%s\n' "$download_worker"
          } | tee "$RUNNER_TEMP/deployment-changes/components.env"

      - name: Publish deployment selection
        uses: actions/upload-artifact@v4
        with:
          name: deployment-changes-${{ github.sha }}
          path: ${{ runner.temp }}/deployment-changes/components.env
          if-no-files-found: error
          retention-days: 7

  dotnet:
    name: .NET
    runs-on: ubuntu-latest
    env:
      ConnectionStrings__Database: Host=127.0.0.1;Port=5432;Database=miraj-of-icarus;Username=miraj-of-icarus;Password=miraj-of-icarus-ci-password;GSS Encryption Mode=Disable
      Cache__ConnectionString: 127.0.0.1:6379
      Database__ApplyMigrations: "true"
    services:
      postgres:
        image: postgres:18.4-bookworm
        env:
          POSTGRES_DB: miraj-of-icarus
          POSTGRES_USER: miraj-of-icarus
          POSTGRES_PASSWORD: miraj-of-icarus-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U miraj-of-icarus -d miraj-of-icarus"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:8.8.1-alpine3.23
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: |
            backend/api/**/packages.lock.json
            backend/game-server/**/packages.lock.json
      - run: dotnet restore backend/api/MirajOfIcarus.slnx --locked-mode
      - run: dotnet restore backend/game-server/MirajOfIcarus.GameServer.slnx --locked-mode
      - run: dotnet test backend/api/MirajOfIcarus.slnx --configuration Release --no-restore
      - run: dotnet test backend/game-server/MirajOfIcarus.GameServer.slnx --configuration Release --no-restore

  client-contracts:
    name: Client contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - run: cmake -S apps/game/windows -B build/client -G Ninja -DMIRAJ_OF_ICARUS_BUILD_WINDOWS_APPS=OFF
      - run: cmake --build build/client
      - run: ctest --test-dir build/client --output-on-failure
      - run: apps/game/windows/tools/test-publish-r2-release.sh

  portal:
    name: Portal
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/portal/web
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/portal/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm run build:cloudflare
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  download-worker:
    name: Download worker
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend/download-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/download-worker/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
