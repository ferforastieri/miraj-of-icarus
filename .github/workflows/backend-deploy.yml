name: Backend deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read
  packages: write

concurrency:
  group: backend-production
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: masicarus-api
            dockerfile: api/Dockerfile
          - image: masicarus-main-server
            dockerfile: game-server/services/coordinator/Masicarus.MainServer/Dockerfile
          - image: masicarus-login-server
            dockerfile: game-server/services/login/Masicarus.LoginServer/Dockerfile
          - image: masicarus-lobby-server
            dockerfile: game-server/services/lobby/Masicarus.LobbyServer/Dockerfile
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Normalize the registry namespace
        id: registry
        run: echo "namespace=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ steps.registry.outputs.namespace }}/${{ matrix.image }}:${{ github.event.workflow_run.head_sha }}
            ghcr.io/${{ steps.registry.outputs.namespace }}/${{ matrix.image }}:main
          labels: org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  deploy:
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Configure the pinned SSH host identity
        env:
          SSH_PRIVATE_KEY: ${{ secrets.LIGHTSAIL_SSH_PRIVATE_KEY }}
          SSH_HOST_KEY: ${{ secrets.LIGHTSAIL_SSH_HOST_KEY }}
        run: |
          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/masicarus-deploy"
          printf '%s\n' "$SSH_HOST_KEY" > "$HOME/.ssh/known_hosts"
          chmod 0600 "$HOME/.ssh/masicarus-deploy" "$HOME/.ssh/known_hosts"

      - name: Install the immutable deployment definition
        env:
          LIGHTSAIL_HOST: ${{ secrets.LIGHTSAIL_HOST }}
          LIGHTSAIL_USER: ${{ secrets.LIGHTSAIL_USER }}
        run: |
          remote="${LIGHTSAIL_USER}@${LIGHTSAIL_HOST}"
          ssh -i "$HOME/.ssh/masicarus-deploy" "$remote" 'mkdir -p /opt/masicarus/infra'
          scp -i "$HOME/.ssh/masicarus-deploy" \
            infra/compose.yml infra/compose.production.yml infra/Caddyfile infra/deploy-backend.sh \
            "${remote}:/opt/masicarus/infra/"

      - name: Authenticate the server to the private container registry
        env:
          GHCR_DEPLOY_TOKEN: ${{ secrets.GHCR_DEPLOY_TOKEN }}
          GHCR_DEPLOY_USER: ${{ secrets.GHCR_DEPLOY_USER }}
          LIGHTSAIL_HOST: ${{ secrets.LIGHTSAIL_HOST }}
          LIGHTSAIL_USER: ${{ secrets.LIGHTSAIL_USER }}
        run: |
          remote="${LIGHTSAIL_USER}@${LIGHTSAIL_HOST}"
          printf '%s' "$GHCR_DEPLOY_TOKEN" | ssh -i "$HOME/.ssh/masicarus-deploy" "$remote" \
            "docker login ghcr.io --username '${GHCR_DEPLOY_USER}' --password-stdin"

      - name: Deploy with health verification and rollback
        env:
          LIGHTSAIL_HOST: ${{ secrets.LIGHTSAIL_HOST }}
          LIGHTSAIL_USER: ${{ secrets.LIGHTSAIL_USER }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          remote="${LIGHTSAIL_USER}@${LIGHTSAIL_HOST}"
          ssh -i "$HOME/.ssh/masicarus-deploy" "$remote" \
            "chmod 0755 /opt/masicarus/infra/deploy-backend.sh && /opt/masicarus/infra/deploy-backend.sh '${RELEASE_SHA}'"
