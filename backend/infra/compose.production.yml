x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  api:
    image: ghcr.io/${MIRAJ_OF_ICARUS_GHCR_NAMESPACE:?Set MIRAJ_OF_ICARUS_GHCR_NAMESPACE}/${MIRAJ_OF_ICARUS_API_IMAGE:-miraj-of-icarus-api}:${MIRAJ_OF_ICARUS_IMAGE_TAG:?Set MIRAJ_OF_ICARUS_IMAGE_TAG}

  main-server:
    image: ghcr.io/${MIRAJ_OF_ICARUS_GHCR_NAMESPACE:?Set MIRAJ_OF_ICARUS_GHCR_NAMESPACE}/${MIRAJ_OF_ICARUS_MAIN_IMAGE:-miraj-of-icarus-main-server}:${MIRAJ_OF_ICARUS_IMAGE_TAG:?Set MIRAJ_OF_ICARUS_IMAGE_TAG}

  login-server:
    image: ghcr.io/${MIRAJ_OF_ICARUS_GHCR_NAMESPACE:?Set MIRAJ_OF_ICARUS_GHCR_NAMESPACE}/${MIRAJ_OF_ICARUS_LOGIN_IMAGE:-miraj-of-icarus-login-server}:${MIRAJ_OF_ICARUS_IMAGE_TAG:?Set MIRAJ_OF_ICARUS_IMAGE_TAG}

  lobby-server:
    image: ghcr.io/${MIRAJ_OF_ICARUS_GHCR_NAMESPACE:?Set MIRAJ_OF_ICARUS_GHCR_NAMESPACE}/${MIRAJ_OF_ICARUS_LOBBY_IMAGE:-miraj-of-icarus-lobby-server}:${MIRAJ_OF_ICARUS_IMAGE_TAG:?Set MIRAJ_OF_ICARUS_IMAGE_TAG}

  portal:
    profiles: [local-only]

  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    environment:
      MIRAJ_OF_ICARUS_TLS_EMAIL: ${MIRAJ_OF_ICARUS_TLS_EMAIL:?Set MIRAJ_OF_ICARUS_TLS_EMAIL}
    depends_on:
      api:
        condition: service_healthy
      login-server:
        condition: service_healthy
      lobby-server:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [backend]
    logging: *default-logging

volumes:
  caddy-data:
  caddy-config:
